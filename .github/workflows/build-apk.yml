name: Build Android APK (YANIS//X)

on:
  push:
    branches:
      - arena/01a0ed99-tueurs-en-s-rie
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build offline Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Seed backend and export offline API data
        env:
          PYTHONPATH: backend
          YANISX_DB: ${{ runner.temp }}/yanisx.sqlite3
          YANISX_MEDIA: ${{ runner.temp }}/media
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt httpx2
          python -m app.seed
          python -m app.export_embedded

      - name: Copy audio assets from the Android media catalogue
        run: |
          git fetch --depth=1 origin arena/01a0e7ec-tueurs-en-s-rie
          mkdir -p frontend/public/audio
          for file in \
            episode-01-estelle-mouzin.wav \
            episode-03-estelle-mouzin-memoire.wav \
            episode-05-guy-georges.wav; do
            git show "FETCH_HEAD:content/media/$file" > "frontend/public/audio/$file"
          done
          ls -lh frontend/public/audio

      - name: Build web bundle and synchronize Capacitor
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/yanisx-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yanisx-android-apk
          path: yanisx-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to the GitHub download page
        if: github.ref == 'refs/heads/arena/01a0ed99-tueurs-en-s-rie'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload app-preview yanisx-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Version Android de prévisualisation avec la nouvelle carte du monde et les dossiers embarqués pour un usage hors ligne.

          Build commit: $GITHUB_SHA. APK de développement à installer manuellement sur Android ; non distribué par le Play Store.
          EOF
          gh release edit app-preview --repo "$GITHUB_REPOSITORY" \
            --title "YANIS//X — APK Android hors ligne" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
