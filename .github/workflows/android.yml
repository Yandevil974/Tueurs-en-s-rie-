name: Build APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "ai-arena/index.html"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    name: APK debug
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verifier l'APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          echo "== contenu =="
          unzip -l "$APK" | head -20
          echo "== page embarquee =="
          unzip -p "$APK" assets/arena-x.html | md5sum
          md5sum ai-arena/index.html
          echo "== manifeste =="
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging "$APK" | head -12
          echo "== signature =="
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$SIGNER" verify --print-certs "$APK" | head -6
          echo "== empreinte attendue =="
          EXPECTED="3a4946d3898508a607ab4bf4666a27d12c6797614a558ce51e616b1f6a49a61d"
          GOT=$("$SIGNER" verify --print-certs "$APK" | grep -i "SHA-256" | head -1 | awk -F': ' '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f' | tr -d ' ')
          echo "obtenu   : $GOT"
          echo "attendu  : $EXPECTED"
          test "$GOT" = "$EXPECTED" || { echo "SIGNATURE INSTABLE : les mises a jour casseront"; exit 1; }

      - name: Preparer le fichier
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ARENA-X.apk
          ls -lh ARENA-X.apk

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ARENA-X-apk
          path: ARENA-X.apk
          retention-days: 90

      - name: Mettre l'APK dans une release
        if: github.ref == 'refs/heads/arena/5353aa12-tueurs-en-s-rie'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete arena-x-app --yes --cleanup-tag 2>/dev/null || true
          gh release create arena-x-app ARENA-X.apk \
            --title "ARENA X - application Android" \
            --target "$GITHUB_SHA" \
            --notes-file android/RELEASE_NOTES.md
