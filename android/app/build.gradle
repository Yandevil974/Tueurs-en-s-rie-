plugins {
    id "com.android.application"
}

android {
    namespace "com.arenax.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.arenax.app"
        minSdk 26
        targetSdk 34
        /* À incrémenter à chaque publication : Android refuse un « downgrade ». */
        versionCode 2
        versionName "1.1"
    }

    /* Clé de signature STABLE, versionnée avec le projet.
       Sans elle, chaque build de la CI générait une clé de debug différente :
       Android refusait alors d'installer la nouvelle version par-dessus
       l'ancienne (signatures différentes) et imposait une désinstallation.
       Ce n'est pas une clé de publication Play Store : ne pas la réutiliser ailleurs. */
    signingConfigs {
        stable {
            storeFile file("keystore.p12")
            storeType "PKCS12"
            storePassword "arenax2026"
            keyAlias "arenax"
            keyPassword "arenax2026"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}

/* Une seule source de vérité : l'application web vit dans ../ai-arena/index.html.
   Elle est copiée dans les assets avant chaque build, donc l'APK embarque
   toujours la dernière version du fichier HTML. */
def webSource = rootProject.file("../ai-arena/index.html")
def assetsDir = file("$projectDir/src/main/assets")

tasks.register("syncWebAsset", Copy) {
    from(webSource) {
        rename { "arena-x.html" }
    }
    into assetsDir
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn "syncWebAsset"
}
